<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>마당 플레이</title>
<style>html,body{color:#fff;background:#202226;height:100%;margin:0;font:15px/1.4 system-ui,Malgun Gothic,sans-serif;overflow:hidden}#view{touch-action:none;position:fixed;inset:0}#view canvas{display:block}#gate{z-index:10;text-align:center;background:#202226ee;place-items:center;padding:24px;display:grid;position:fixed;inset:0}#gate h1{margin:0 0 8px;font-size:24px}#gate p{opacity:.8;margin:0 0 20px}#gate button{font:inherit;color:#1f4a3d;background:#9be3cb;border:0;border-radius:16px;padding:14px 44px;font-size:20px;font-weight:700}#gate button:disabled{opacity:.4}#gate[hidden]{display:none}#hint{z-index:5;pointer-events:none;background:#000a;border-radius:14px;padding:10px 18px;position:fixed;top:40%;left:50%;transform:translate(-50%)}#hint[hidden],#sheet[hidden],#edge[hidden]{display:none}.poweredby-img{display:none!important}#sheet{z-index:4;max-height:55vh;padding:12px 12px max(12px, env(safe-area-inset-bottom));flex-direction:column;gap:10px;display:flex;position:fixed;bottom:0;left:0;right:0;overflow-y:auto}#sheet .b3{width:auto;box-shadow:0 -2px 16px #0006}#sheet .bBubble:after{display:none}#sheet .bLine{font-size:20px}#sheet .bCards{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;display:grid}#sheet .pCard{width:auto;min-height:0}#sheet .pCard img{height:80px}#sheet .bInfo img{max-height:30vh}#sheet .bInfo.big img{max-height:60vh}#sheet>.pBtn{align-self:stretch;padding:14px}.sizeRow{justify-content:center;gap:8px;display:flex}.sizeRow .on{color:#1f4a3d;background:#9be3cb}#play .pHud{top:max(10px, env(safe-area-inset-top));flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 90px);bottom:auto}#play .pTeacher{top:max(10px, env(safe-area-inset-top));flex-direction:column-reverse;align-items:flex-end;bottom:auto}#edge{z-index:3;pointer-events:none;position:fixed;transform:translate(-50%,-50%)}#edge span{filter:drop-shadow(0 0 4px #000a);border:14px solid #0000;border-left:22px solid #9be3cb;width:0;height:0;display:block}</style>
<script src="localize-8thwall-ui.js"></script>
  <script type="module" crossorigin src="./assets/play-BzQImpXS.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/player-zhtlNGGX.js">
  <link rel="stylesheet" crossorigin href="./assets/player-BO5rk6H3.css">
</head>
<body>
<main id="view"></main>
<div id="hint" hidden></div>
<div id="sheet" hidden></div>
<div id="edge" hidden><span></span></div>
<div id="gate">
  <div>
    <h1 id="title">불러오는 중…</h1>
    <p id="msg"></p>
    <button id="btnStart" disabled>시작하기</button>
  </div>
</div>
</body>
</html>
